name: Deploy to EC2

# 이 EC2(15.164.30.174)는 응답하지 않는다. 백엔드는 Render(render.yaml)가 배포하고,
# Render 는 푸시를 스스로 받으므로 여기서 배포할 것이 없다. 푸시마다 SSH 타임아웃으로
# 실패 알림만 오던 것을 끊기 위해 자동 실행을 뗀다.
# EC2 를 되살려 다시 쓰려면 아래 push 트리거의 주석을 풀면 된다.
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 15.164.30.174
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/SceneLens
            git pull origin main
            source .venv/bin/activate
            pip install -r backend/requirements.txt -q
            sudo systemctl restart scenelens
            sudo systemctl status scenelens --no-pager
